# Every push and pull request: typecheck, lint, format check and unit tests on Windows.
# No Claude usage: the live integration test only runs with EB_INTEGRATION=1, which CI never sets.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
