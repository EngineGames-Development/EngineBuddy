# Push a tag like v0.2.0 → checks run, then the Windows installer and portable exe are built and
# attached to a GitHub Release. Set "version" in package.json to match before tagging.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      # --publish never: on a tag electron-builder otherwise tries to publish by itself and fails
      # without a token. The step below creates the release with the files instead.
      - run: npm run dist -- --publish never
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "EngineBuddy $GITHUB_REF_NAME" \
            --generate-notes \
            release/EngineBuddy-Setup-*.exe release/EngineBuddy-*-portable.exe
