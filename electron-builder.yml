# Windows builds: `npm run dist` → release/EngineBuddy-Setup-<version>.exe (installer) and
# release/EngineBuddy-<version>-portable.exe (no install). Not code-signed (docs/security-audit.md R8).
appId: dev.enginegames.enginebuddy
productName: EngineBuddy
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
  - '!**/*.map'
asar: true

# Electron fuses (SECURITY.md §7, docs/security-audit.md F5): a packaged EngineBuddy can't be
# turned into a general-purpose Node runtime or debugged from the command line, and only loads its
# own, integrity-checked app.asar.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  enableCookieEncryption: true
  # Our pages are bundled files loaded over file://, which needs this.
  grantFileProtocolExtraPrivileges: true

win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  artifactName: EngineBuddy-Setup-${version}.${ext}

portable:
  artifactName: EngineBuddy-${version}-portable.${ext}

# Microsoft Store package: `npm run dist:store` → release/EngineBuddy-<version>.appx. The Store signs
# it, so no SmartScreen warning. The three identity values come from Partner Center (Product
# identity page) once the app name is reserved; until then these placeholders build a test package.
appx:
  identityName: EngineGamesDevelopment.EngineBuddy
  publisher: CN=00000000-0000-0000-0000-000000000000
  publisherDisplayName: EngineGames-Development
  applicationId: EngineBuddy
  displayName: EngineBuddy
  backgroundColor: '#14111c'
  languages: [en-US, de-DE, fr-FR, es-ES]
  artifactName: EngineBuddy-${version}.${ext}
